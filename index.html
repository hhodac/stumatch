<div id="eh-student-mobile">
  <style>
    #eh-student-mobile{font-family:'Poppins',Arial,sans-serif;color:#0B2D4B;font-size:14px;--eh-green:#168a76;--eh-radius:16px;background:transparent}
    #eh-student-mobile *{box-sizing:border-box}
    #eh-student-mobile .eh-window{background:#F8F9FA;border:1px solid #dce5eb;border-radius:18px;overflow:hidden}
    #eh-student-mobile .eh-header{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:20px 26px;background:#fff;border-bottom:1px solid #e2e9ee;flex-wrap:wrap}
    #eh-student-mobile .eh-logo{font-size:23px;font-weight:700;letter-spacing:-.6px;display:flex;align-items:center;gap:9px}
    #eh-student-mobile .eh-logo span{color:var(--eh-green)}
    #eh-student-mobile .eh-nav{display:flex;gap:8px;flex-wrap:wrap}
    #eh-student-mobile button{font:inherit;border:1px solid #ccd9e2;border-radius:9px;padding:10px 15px;background:white;color:#0B2D4B;min-height:42px}
    #eh-student-mobile button:disabled{opacity:.45}
    #eh-student-mobile button.eh-primary{background:#F5B301;border-color:#F5B301;font-weight:600}
    #eh-student-mobile button.eh-green{background:var(--eh-green);color:#fff;border-color:var(--eh-green)}
    #eh-student-mobile button[aria-pressed=true]{border-color:var(--eh-green);background:#e8f6f1}
    #eh-student-mobile .eh-demo{background:#EAF4FF;padding:10px 26px;font-size:12px;display:flex;gap:14px;justify-content:space-between;flex-wrap:wrap}
    #eh-student-mobile .eh-layout{display:grid;grid-template-columns:190px 1fr;min-height:550px}
    #eh-student-mobile .eh-steps{background:white;padding:22px 14px;border-right:1px solid #e2e9ee;display:flex;flex-direction:column;gap:6px}
    #eh-student-mobile .eh-steps button{text-align:left;border:0;background:transparent;font-size:12px;display:flex;gap:9px;align-items:center;padding:10px}
    #eh-student-mobile .eh-steps button.active{background:#EAF4FF;font-weight:600}
    #eh-student-mobile .eh-number{width:23px;height:23px;border-radius:50%;background:#edf1f5;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
    #eh-student-mobile .active .eh-number{background:#0B2D4B;color:white}
    #eh-student-mobile .done .eh-number{background:var(--eh-green);color:white}
    #eh-student-mobile .eh-content{padding:28px;min-width:0}
    #eh-student-mobile h1{font-size:27px;line-height:1.25;margin:0 0 10px;letter-spacing:-.6px}
    #eh-student-mobile h2{font-size:18px;margin:0 0 12px}
    #eh-student-mobile h3{font-size:15px;margin:0 0 8px}
    #eh-student-mobile p{line-height:1.6;margin:8px 0 18px}
    #eh-student-mobile .eh-muted{color:#546b7e;font-size:12px}
    #eh-student-mobile .eh-panel{background:white;border:1px solid #e0e8ee;border-radius:var(--eh-radius);padding:20px;margin:16px 0}
    #eh-student-mobile .eh-two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    #eh-student-mobile .eh-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0}
    #eh-student-mobile .eh-property{background:white;border:1px solid #e0e8ee;border-radius:var(--eh-radius);overflow:hidden;min-width:0}
    #eh-student-mobile .eh-property-body{padding:15px}
    #eh-student-mobile .eh-property-art{height:85px;background:#EAF4FF;display:flex;align-items:center;justify-content:space-between;padding:18px;gap:8px;font-size:12px}
    #eh-student-mobile .eh-property-art i{color:var(--eh-green)}
    #eh-student-mobile .eh-property-art svg{width:34px;height:34px}
    #eh-student-mobile .eh-tag{display:inline-block;padding:5px 8px;background:#edf7f3;color:#126b59;font-size:11px;border-radius:6px;margin:3px 3px 3px 0}
    #eh-student-mobile .eh-tag.warn{background:#fff3d2;color:#735000}
    #eh-student-mobile .eh-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:20px}
    #eh-student-mobile .eh-field{display:block;margin-bottom:16px;min-width:0}
    #eh-student-mobile .eh-field>span{display:block;font-size:12px;font-weight:600;margin-bottom:7px}
    #eh-student-mobile input:not([type=checkbox]),#eh-student-mobile select,#eh-student-mobile textarea{width:100%;border:1px solid #c9d6df;border-radius:8px;padding:11px;background:white;color:#0B2D4B;font:inherit;font-size:16px}
    #eh-student-mobile textarea{min-height:100px;resize:vertical}
    #eh-student-mobile .eh-check{display:flex;gap:10px;align-items:flex-start;margin:14px 0;line-height:1.5}
    #eh-student-mobile input[type=checkbox]{accent-color:var(--eh-green);width:18px;height:18px;flex-shrink:0;margin-top:2px}
    #eh-student-mobile .eh-checkline{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #edf1f4;align-items:flex-start}
    #eh-student-mobile .eh-checkline:last-child{border:0}
    #eh-student-mobile .eh-checkline i{color:var(--eh-green);flex-shrink:0}
    #eh-student-mobile .eh-price{font-size:22px;font-weight:700;margin:12px 0 4px}
    #eh-student-mobile .eh-note{background:#fff5dc;padding:13px 15px;border-radius:9px;font-size:12px;line-height:1.6;margin:15px 0}
    #eh-student-mobile .eh-success{background:#eaf7f2;border-radius:var(--eh-radius);padding:24px;margin:18px 0}
    #eh-student-mobile .eh-table-wrap{overflow:auto}
    #eh-student-mobile table{width:100%;border-collapse:collapse;font-size:13px}
    #eh-student-mobile th,#eh-student-mobile td{padding:12px 9px;text-align:left;border-bottom:1px solid #e5ebef;vertical-align:top;min-width:100px}
    #eh-student-mobile th{background:#EAF4FF}
    #eh-student-mobile .eh-message{background:#EAF4FF;padding:15px;border-radius:12px;margin:12px 0;line-height:1.6}
    #eh-student-mobile .eh-message.reply{background:#eaf7f2}
    #eh-student-mobile .eh-error{color:#a83131;margin-top:12px}
    #eh-student-mobile .eh-footer{padding:13px 26px;background:white;border-top:1px solid #e2e9ee;font-size:11px;color:#546b7e}
    @media(max-width:760px){#eh-student-mobile .eh-layout{grid-template-columns:1fr}#eh-student-mobile .eh-steps{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid #e2e9ee;padding:10px}#eh-student-mobile .eh-steps button{padding:5px 8px}#eh-student-mobile .eh-steps .eh-step-name{display:none}#eh-student-mobile .eh-grid{grid-template-columns:1fr}#eh-student-mobile .eh-two{grid-template-columns:1fr}#eh-student-mobile .eh-content{padding:20px}#eh-student-mobile .eh-header{padding:16px}#eh-student-mobile .eh-property-art{height:65px}}
    #eh-student-mobile{max-width:430px;margin:0 auto}
    #eh-student-mobile .eh-window{border:5px solid #0B2D4B;border-radius:30px}
    #eh-student-mobile .eh-header{padding:18px 16px 12px;gap:14px}
    #eh-student-mobile .eh-logo{font-size:21px;flex-wrap:wrap;gap:5px}
    #eh-student-mobile .eh-nav{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
    #eh-student-mobile .eh-nav button{font-size:11px;padding:8px 4px;min-height:44px}
    #eh-student-mobile .eh-demo{padding:10px 16px;font-size:11px;gap:4px}
    #eh-student-mobile .eh-layout{grid-template-columns:1fr;min-height:0}
    #eh-student-mobile .eh-steps{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid #e2e9ee;padding:10px 12px;gap:0}
    #eh-student-mobile .eh-steps button{padding:4px;min-height:36px;flex:1;justify-content:center}
    #eh-student-mobile .eh-step-name{display:none}
    #eh-student-mobile .eh-number{width:25px;height:25px}
    #eh-student-mobile .eh-content{padding:20px 16px}
    #eh-student-mobile h1{font-size:25px;margin-top:8px}
    #eh-student-mobile .eh-two,#eh-student-mobile .eh-grid{grid-template-columns:1fr}
    #eh-student-mobile .eh-panel{padding:16px}
    #eh-student-mobile .eh-actions{align-items:stretch}
    #eh-student-mobile .eh-actions button{flex:1;min-width:110px;min-height:44px}
    #eh-student-mobile .eh-primary{min-height:46px}
    #eh-student-mobile form>.eh-primary{width:100%}
    #eh-student-mobile .eh-property-art{height:96px}
    #eh-student-mobile .eh-footer{padding:14px 16px}
    #eh-student-mobile .eh-table-wrap{overflow:visible}
    #eh-student-mobile .eh-mobile-comparison{display:grid;grid-template-columns:1fr;gap:12px}
    #eh-student-mobile .eh-pair{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid #e5ebef}
    #eh-student-mobile .eh-pair strong{text-align:right}
  </style>
  <div class="eh-window">
    <header class="eh-header"><div class="eh-logo"><i data-lucide="house" aria-hidden="true"></i>EduHouse <span>Assurance</span></div><nav class="eh-nav" aria-label="Main navigation"><button data-go="2" class="cursor-interaction">Find housing</button><button data-workspace class="cursor-interaction">My workspace</button><button data-reset class="cursor-interaction">Restart demo</button></nav></header>
    <div class="eh-demo"><span>INTERACTIVE CONCEPT · Fictional listings and simulated responses</span><span id="eh-account">Guest · no real sign-in</span></div>
    <div class="eh-layout"><nav class="eh-steps" id="eh-stepnav" aria-label="Student journey"></nav><main class="eh-content" id="eh-screen" aria-live="polite"></main></div>
    <footer class="eh-footer">No real authentication, messages, bookings or payments. Checks do not guarantee property quality or safety. Never enter real passwords or identity documents.</footer>
  </div>
  <script>
  (()=>{
    const root=document.getElementById('eh-student-mobile');
    const steps=['Demo sign-in','Housing preferences','Search results','Compare options','Check property','Contact provider','Arrange viewing','Provider application','Home secured'];
    const homes=[
      {id:'a',name:'Carlton study room',area:'Carlton',type:'Shared room',rent:320,utilities:25,commute:15,bond:1280,included:false,complete:true,desc:'Private bedroom in a shared apartment. Shared bathroom and kitchen.'},
      {id:'b',name:'Parkville studio',area:'Parkville',type:'Studio',rent:350,utilities:0,commute:20,bond:1400,included:true,complete:true,desc:'Self-contained studio. Electricity, water and internet included in this example.'},
      {id:'c',name:'Brunswick share house',area:'Brunswick',type:'Shared room',rent:300,utilities:35,commute:30,bond:1200,included:false,complete:false,desc:'Private bedroom with shared facilities. Some property information is awaiting review.'}
    ];
    let state={step:0,max:0,saved:[],compare:[],selected:'b',signed:false,prefs:{budget:360,commute:30,type:'Any',date:'2027-02-01',campus:'Swinburne University — Hawthorn'},enquired:false,viewed:false};
    const ui={radius:16,compact:false};
    const money=n=>'$'+Number(n).toLocaleString('en-AU');
    const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const btn=(label,attrs='',cls='')=>`<button type="button" class="cursor-interaction ${cls}" ${attrs}>${label}</button>`;
    const field=(label,name,value,type='text')=>`<label class="eh-field"><span>${label}</span><input name="${name}" type="${type}" value="${escape(value)}" ${type==='number'?'min="0"':''} required></label>`;
    function persist(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{prototype:'EduHouse student journey',step:steps[state.step],selectedProperty:state.selected,saved:state.saved},privateContent:{...state}}).catch(()=>{});}
    function go(n){state.step=n;state.max=Math.max(n,state.max);render();persist();}
    function chosen(){return homes.find(h=>h.id===state.selected)||homes[1];}
    function property(h){return `<article class="eh-property"><div class="eh-property-art"><i data-lucide="${h.type==='Studio'?'building-2':'house'}" aria-hidden="true"></i><span>${h.type}<br>${h.area}</span></div><div class="eh-property-body"><h3>${h.name}</h3><span class="eh-tag ${h.complete?'':'warn'}">${h.complete?'Listed checks completed':'Property details pending'}</span><div class="eh-price">${money(h.rent)}<span class="eh-muted"> / week rent</span></div><p class="eh-muted">${money(h.rent+h.utilities)} estimated total / week<br>${h.commute}-minute illustrative commute</p><label class="eh-check"><input type="checkbox" data-compare="${h.id}" ${state.compare.includes(h.id)?'checked':''}>Compare this option</label><div class="eh-actions">${btn(state.saved.includes(h.id)?'Saved ✓':'Save',`data-save="${h.id}" aria-pressed="${state.saved.includes(h.id)}"`)}${btn('View details',`data-detail="${h.id}"`,'eh-primary')}</div></div></article>`;}
    function mobileCompare(list){return `<div class="eh-mobile-comparison">${list.map(x=>`<article class="eh-panel"><h2>${x.name}</h2>${[['Weekly rent',money(x.rent)],['Utilities',x.included?'Included':money(x.utilities)+' estimated'],['Weekly total',money(x.rent+x.utilities)],['Upfront bond',money(x.bond)],['Commute estimate',x.commute+' minutes'],['Bathroom',x.type==='Studio'?'Private':'Shared'],['Property information',x.complete?'Listed checks completed':'Pending review']].map(([key,value])=>`<div class="eh-pair"><span>${key}</span><strong>${value}</strong></div>`).join('')}<div class="eh-actions">${btn('Check this home',`data-detail="${x.id}"`,'eh-primary')}</div></article>`).join('')}</div>`;}
    function render(){
      root.style.setProperty('--eh-radius',ui.radius+'px');
      const screen=root.querySelector('#eh-screen');
      root.querySelector('#eh-account').textContent=state.signed?'Demo student · signed in':'Guest · no real sign-in';
      root.querySelector('#eh-stepnav').innerHTML=steps.map((s,i)=>btn(`<span class="eh-number">${i<state.step?'✓':i+1}</span><span class="eh-step-name">${s}</span>`,`data-step="${i}" ${i>state.max?'disabled':''} ${i===state.step?'aria-current="step"':''}`,`${i===state.step?'active':i<state.step?'done':''}`)).join('');
      const h=chosen();const intro=(title,sub)=>`<div class="eh-muted">STEP ${state.step+1} OF 9</div><h1>${title}</h1><p>${sub}</p>`;
      if(state.step===0)screen.innerHTML=intro('Your student housing journey starts here','Use a fictional student account to explore the complete flow.')+`<div class="eh-two"><form id="eh-login" class="eh-panel"><h2>Welcome back</h2>${field('Demo email — do not enter personal data','email','student@example.com','email')}<div class="eh-note">This prototype does not authenticate you. No password is needed.</div><button class="eh-primary cursor-interaction" type="submit">Continue with demo account</button></form><div class="eh-panel"><h2>Find a home that fits your study life.</h2><div class="eh-checkline"><i data-lucide="search"></i>Search participating providers</div><div class="eh-checkline"><i data-lucide="shield-check"></i>Understand verification evidence</div><div class="eh-checkline"><i data-lucide="list-checks"></i>Compare costs and organise your search</div>${btn('Browse without signing in','data-go="1"')}</div></div>`;
      if(state.step===1)screen.innerHTML=intro('Tell us what you need','Save your housing preferences once. No identity documents are required.')+`<form id="eh-prefs" class="eh-panel"><label class="eh-field"><span>University / campus</span><select name="campus"><option>${escape(state.prefs.campus)}</option></select></label><div class="eh-two">${field('Maximum total weekly budget (AUD)','budget',state.prefs.budget,'number')}${field('Preferred maximum commute (minutes)','commute',state.prefs.commute,'number')}${field('Move-in date','date',state.prefs.date,'date')}<label class="eh-field"><span>Accommodation type</span><select name="type">${['Any','Studio','Shared room'].map(v=>`<option ${v===state.prefs.type?'selected':''}>${v}</option>`).join('')}</select></label></div><p class="eh-muted">Commute times, availability and costs are illustrative. Example lease duration: six months.</p><button type="submit" class="eh-primary cursor-interaction">Find matching homes</button></form>`;
      if(state.step===2){const filtered=homes.filter(x=>x.rent+x.utilities<=state.prefs.budget&&x.commute<=state.prefs.commute&&(state.prefs.type==='Any'||x.type===state.prefs.type));screen.innerHTML=intro('Explore your housing options',`${filtered.length} illustrative matches · ${money(state.prefs.budget)} total weekly budget · ${state.prefs.commute}-minute commute preference`)+`<div class="eh-actions">${btn('Edit preferences','data-go="1"')}${btn(`Compare (${state.compare.length})`,'data-go="3" '+(state.compare.length<2?'disabled':''),'eh-primary')}${btn('My saved homes','data-workspace')}</div><div class="eh-grid">${filtered.map(property).join('')}</div>`+(filtered.length?'':`<div class="eh-panel"><h2>No example matches</h2><p>Adjust your budget, commute or accommodation type. No affordable home is guaranteed.</p>${btn('Adjust preferences','data-go="1"','eh-primary')}</div>`);}
      if(state.step===3){const list=homes.filter(x=>state.compare.includes(x.id));screen.innerHTML=intro('Compare the real cost of each option','A lower advertised rent does not always mean a lower total housing cost.')+(list.length<2?`<div class="eh-panel">Select at least two homes in search results.${btn('Return to results','data-go="2"')}</div>`:`<div class="eh-panel eh-table-wrap"><table><thead><tr><th>Comparison</th>${list.map(x=>`<th>${x.name}</th>`).join('')}</tr></thead><tbody>${[['Weekly rent',x=>money(x.rent)],['Utilities',x=>x.included?'Included':money(x.utilities)+' estimated / week'],['Weekly total',x=>money(x.rent+x.utilities)],['Bond — separate',x=>money(x.bond)],['Commute — estimate',x=>x.commute+' minutes'],['Property information',x=>x.complete?'Listed checks completed':'Pending review'],['Living arrangements',x=>x.type==='Studio'?'Private bathroom':'Shared bathroom']].map(([label,fn])=>`<tr><td>${label}</td>${list.map(x=>`<td>${fn(x)}</td>`).join('')}</tr>`).join('')}<tr><td>Next step</td>${list.map(x=>`<td>${btn('Check this home',`data-detail="${x.id}"`,'eh-primary')}</td>`).join('')}</tr></tbody></table></div><div class="eh-note">Estimated utilities are not a quotation. Bond is an upfront payment, not part of weekly cost. Additional charges must be confirmed with the provider.</div>`);}
      if(state.step===4)screen.innerHTML=intro(h.name,`${h.area} · ${h.type} · Fictional provider: Campus Homes Demo`)+`<div class="eh-two"><div class="eh-panel"><h2>Costs and suitability</h2><div class="eh-price">${money(h.rent+h.utilities)} / week</div><p class="eh-muted">${money(h.rent)} rent + ${h.included?'included utilities':money(h.utilities)+' estimated utilities'}<br>Upfront bond: ${money(h.bond)} (separate)</p><p>${h.desc}</p><span class="eh-tag">${h.commute}-minute estimated commute</span><span class="eh-tag ${h.rent+h.utilities>state.prefs.budget?'warn':''}">${h.rent+h.utilities<=state.prefs.budget?'Within stated budget':'Above stated budget'}</span><p class="eh-muted">Availability: example only · Move-in preference: ${escape(state.prefs.date)}</p></div><div class="eh-panel"><h2>What has been checked?</h2>${[['Identity','Demo provider identity evidence checked'],['Authority to advertise','Demo authority evidence checked'],['Property details',h.complete?'Demo address and listing information checked':'Pending — not yet checked']].map(([label,txt])=>`<div class="eh-checkline"><i data-lucide="${label==='Property details'&&!h.complete?'circle-alert':'circle-check'}"></i><div><strong>${label}</strong><div class="eh-muted">${txt}</div></div></div>`).join('')}<p class="eh-muted">Illustrative check date: 15 Sep 2026. Not a physical inspection, legal endorsement or safety guarantee.</p></div></div><div class="eh-actions">${btn(state.saved.includes(h.id)?'Saved ✓':'Save home',`data-save="${h.id}"`)}${btn('Contact provider','data-go="5"','eh-primary')}${btn('Back to results','data-go="2"')}</div>`;
      if(state.step===5)screen.innerHTML=intro('Contact the accommodation provider',`${h.name} · Your enquiry stays organised in your workspace.`)+(!state.signed?`<div class="eh-panel"><h2>Sign in to contact or save</h2><p>Browsing and comparison remain free. Continue using a fictional account only.</p>${btn('Sign in with demo account','data-demo-auth','eh-primary')}</div>`:`<form id="eh-enquiry" class="eh-panel"><h2>New enquiry</h2><label class="eh-field"><span>Message — fictional example only</span><textarea name="message" required>Hello, I am looking for accommodation near my campus from ${escape(state.prefs.date)}. Could you confirm availability, all charges and a viewing time?</textarea></label><label class="eh-check"><input name="consent" type="checkbox" required>I agree to share my demo contact details and this enquiry with the selected demo provider.</label><p class="eh-muted">No identity documents, passport or payment details are requested.</p><button type="submit" class="eh-primary cursor-interaction">Send simulated enquiry</button></form>`);
      if(state.step===6)screen.innerHTML=intro('Arrange a viewing','The following provider reply and appointments are simulated, not live messages.')+`<div class="eh-panel"><div class="eh-message"><strong>You · simulated enquiry</strong><br>Requested availability, full costs and a viewing for ${h.name}.</div><div class="eh-message reply"><strong>Campus Homes Demo · simulated reply</strong><br>The example property is available. You can request an in-person or video viewing. Please review the full terms before applying.</div><form id="eh-viewing"><div class="eh-two"><label class="eh-field"><span>Viewing type</span><select name="viewtype"><option>Video viewing</option><option>In-person viewing</option></select></label><label class="eh-field"><span>Illustrative appointment</span><select name="slot"><option>Tomorrow, 10:00 am — local property time</option><option>Tomorrow, 2:00 pm — local property time</option></select></label></div><button type="submit" class="eh-primary cursor-interaction">Confirm demo viewing</button></form>${state.viewed?`<div class="eh-success"><strong>Demo viewing completed</strong><p>Next, review the provider's application requirements. A viewing does not guarantee approval.</p>${btn('Review application handoff','data-go="7"','eh-primary')}${btn('Keep searching','data-go="2"')}</div>`:''}</div>`;
      if(state.step===7)screen.innerHTML=intro('Continue with the provider','EduHouse helps you choose and organise. Applications, contracts and payments remain with the provider.')+`<div class="eh-panel"><h2>Before leaving EduHouse</h2><div class="eh-checkline"><i data-lucide="check"></i>Confirm availability, total charges and lease conditions.</div><div class="eh-checkline"><i data-lucide="check"></i>Review the provider's privacy notice before sharing documents.</div><div class="eh-checkline"><i data-lucide="check"></i>Use independently confirmed provider contact and payment channels.</div><div class="eh-note">This demo does not open an external site or accept an application. Provider approval, a signed agreement and payment confirmation happen outside EduHouse.</div><label class="eh-check"><input id="eh-completed" type="checkbox">Simulate: the provider approved my application and I signed the agreement outside EduHouse.</label>${btn('Record simulated housing outcome','data-outcome','eh-primary')}<div id="eh-outcome-error" role="alert"></div></div><div class="eh-actions">${btn('Return to search','data-go="2"')}</div>`;
      if(state.step===8)screen.innerHTML=intro('Your housing search is complete','Student-reported outcome · simulated, not independently confirmed.')+`<div class="eh-success"><i data-lucide="circle-check"></i><h2>Home secured — demo outcome</h2><p>${h.name} · ${h.area}<br>Move-in preference: ${escape(state.prefs.date)}<br>Estimated weekly housing cost: ${money(h.rent+h.utilities)}</p><p class="eh-muted">EduHouse has recorded your update. This is not a booking confirmation or an endorsement of the property.</p></div><div class="eh-panel"><h2>Prepare for moving in</h2><label class="eh-check"><input type="checkbox">Keep a copy of the signed agreement.</label><label class="eh-check"><input type="checkbox">Confirm bond arrangements and payment receipts.</label><label class="eh-check"><input type="checkbox">Arrange keys and complete a condition report.</label><label class="eh-check"><input type="checkbox">Save provider and university support contacts.</label></div><div class="eh-actions">${btn('Explore the journey again','data-reset')}${btn('View saved homes','data-workspace')}</div>`;
      if(state.step===3&&state.compare.length>=2){const panel=screen.querySelector('.eh-table-wrap');if(panel)panel.outerHTML=mobileCompare(homes.filter(x=>state.compare.includes(x.id)));}
      if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});
    }
    root.addEventListener('click',e=>{
      const b=e.target.closest('button');if(!b||b.disabled)return;
      if(b.hasAttribute('data-reset')){state={step:0,max:0,saved:[],compare:[],selected:'b',signed:false,prefs:{budget:360,commute:30,type:'Any',date:'2027-02-01',campus:'University of Melbourne — Parkville'},enquired:false,viewed:false};render();persist();}
      else if(b.hasAttribute('data-step'))go(Number(b.dataset.step));
      else if(b.hasAttribute('data-go'))go(Number(b.dataset.go));
      else if(b.hasAttribute('data-save')){if(!state.signed){state.selected=b.dataset.save;go(5);return;}const id=b.dataset.save;state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];render();persist();}
      else if(b.hasAttribute('data-detail')){state.selected=b.dataset.detail;go(4);}
      else if(b.hasAttribute('data-demo-auth')){state.signed=true;render();persist();}
      else if(b.hasAttribute('data-outcome')){if(root.querySelector('#eh-completed').checked)go(8);else root.querySelector('#eh-outcome-error').innerHTML='<p class="eh-error">Confirm the simulated provider outcome before recording it.</p>';}
      else if(b.hasAttribute('data-workspace')){if(!state.signed){go(0);return;}root.querySelector('#eh-screen').innerHTML=`<h1>My housing workspace</h1><p>${state.saved.length} saved homes · ${state.enquired?'1 simulated enquiry':'No enquiries yet'} · ${state.viewed?'Demo viewing completed':'No completed viewings'}</p><div class="eh-grid">${homes.filter(x=>state.saved.includes(x.id)).map(property).join('')}</div>${state.enquired?`<div class="eh-panel"><h2>${chosen().name}</h2><p>Status: ${state.step===8?'Outcome recorded':state.viewed?'Viewing completed — application with provider':'Simulated reply received'}</p>${btn('Open conversation','data-go="6"')}${btn('Review selected home','data-go="4"')}</div>`:''}${btn('Continue searching','data-go="2"','eh-primary')}`;if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});}
    });
    root.addEventListener('change',e=>{if(e.target.hasAttribute('data-compare')){const id=e.target.dataset.compare;state.compare=e.target.checked?[...new Set([...state.compare,id])]:state.compare.filter(x=>x!==id);render();persist();}});
    root.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
      if(f.id==='eh-login'){state.signed=true;go(1);}
      if(f.id==='eh-prefs'){const d=new FormData(f);state.prefs={budget:Number(d.get('budget')),commute:Number(d.get('commute')),type:d.get('type'),date:d.get('date'),campus:d.get('campus')};go(2);}
      if(f.id==='eh-enquiry'){state.enquired=true;if(!state.saved.includes(state.selected))state.saved.push(state.selected);go(6);}
      if(f.id==='eh-viewing'){state.viewed=true;render();persist();}
    });
    const saved=window.openai?.widgetState?.privateContent;if(saved?.prefs&&Array.isArray(saved.saved)&&Number.isInteger(saved.step)&&saved.step>=0&&saved.step<9){state={...state,...saved};}
    render();
    window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent;if(s?.prefs&&Array.isArray(s.saved)&&Number.isInteger(s.step)&&s.step>=0&&s.step<9){state={...state,...s};render();}});
    if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSlider(ui,'radius',{label:'Panel corners',min:4,max:24,step:2,unit:'px'});}
  })();
  </script>
</div>
